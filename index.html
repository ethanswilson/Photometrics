<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photometrics — Beam Ray Tracer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      z-index: 10;
    }
    #header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ccc;
    }
    #header .info {
      font-size: 11px;
      color: #666;
    }
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #sidebar {
      width: 280px;
      background: #111;
      border-right: 1px solid #222;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 12px;
      font-size: 12px;
    }
    #sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin: 12px 0 6px 0;
    }
    #sidebar h2:first-child { margin-top: 0; }
    #sidebar label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0;
      color: #aaa;
    }
    #sidebar input[type="range"] {
      width: 120px;
      accent-color: #f90;
    }
    #sidebar select {
      width: 130px;
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #333;
      padding: 2px 4px;
      font-size: 11px;
      font-family: inherit;
    }
    #sidebar .value {
      color: #f90;
      min-width: 40px;
      text-align: right;
      font-size: 11px;
    }
    #sidebar .section {
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 8px;
      margin-bottom: 4px;
    }
    #sidebar button {
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #333;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      margin: 2px;
    }
    #sidebar button:hover { background: #252525; }
    #sidebar button.active { border-color: #f90; color: #f90; }

    /* Mobile toggle button */
    #sidebar-toggle {
      display: none;
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 100;
      background: #1a1a1a;
      color: #f90;
      border: 1px solid #333;
      width: 44px;
      height: 44px;
      font-size: 22px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      line-height: 1;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      #header { display: none; }
      #main { flex-direction: column; }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 35vh;
        z-index: 50;
        transform: translateY(-100%);
        transition: transform 0.25s ease;
        border-right: none;
        border-bottom: 2px solid #333;
        padding: 8px 12px 12px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #sidebar.open {
        transform: translateY(0);
      }
      #sidebar-toggle { display: block; }
      #sidebar h2 { font-size: 10px; margin: 8px 0 3px 0; }
      #sidebar label { font-size: 12px; margin: 2px 0; }
      #sidebar input[type="range"] { width: 55%; height: 24px; }
      #sidebar select { font-size: 12px; padding: 4px 6px; width: 50%; }
      #sidebar button { padding: 6px 12px; font-size: 12px; }
      #sidebar .checkbox-row { font-size: 12px; padding: 2px 0; }
      #sidebar .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; }
      #sidebar .value { font-size: 11px; }
      #sidebar .section { padding-bottom: 4px; margin-bottom: 2px; }
      #overlay { font-size: 10px; }
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 11px;
      color: #555;
      pointer-events: none;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      color: #aaa;
    }
    .checkbox-row input[type="checkbox"] {
      accent-color: #f90;
    }
    /* Password gate */
    #auth-gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #auth-gate.hidden { display: none; }
    #auth-gate h1 {
      font-size: 16px;
      color: #888;
      letter-spacing: 1px;
    }
    #auth-gate input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      width: 240px;
      text-align: center;
      outline: none;
    }
    #auth-gate input:focus { border-color: #f90; }
    #auth-gate .error { color: #f44; font-size: 12px; height: 16px; }
    #app-root { display: none; }
    #app-root.visible { display: flex; flex-direction: column; height: 100vh; }
  </style>
</head>
<body>
  <!-- Password gate -->
  <div id="auth-gate">
    <h1>PHOTOMETRICS</h1>
    <input type="password" id="auth-input" placeholder="password" autocomplete="off" autofocus>
    <button id="auth-submit" style="background:#1a1a1a;color:#e0e0e0;border:1px solid #333;padding:10px 32px;font-size:14px;font-family:inherit;cursor:pointer;border-radius:4px;">Enter</button>
    <div class="error" id="auth-error"></div>
  </div>

  <div id="app-root">
  <button id="sidebar-toggle">&#9776;</button>
  <div id="header">
    <h1>PHOTOMETRICS — BEAM RAY TRACER</h1>
    <span class="info" id="fps-display">-- fps</span>
  </div>
  <div id="main">
    <div id="sidebar">
      <h2>Light Fixture</h2>
      <div class="section">
        <label>Type <select id="light-type"></select></label>
      </div>

      <h2>Beam Control</h2>
      <div class="section">
        <label>Intensity <span class="value" id="intensity-val">100%</span></label>
        <input type="range" id="intensity" min="0" max="200" value="100">
        <label>Beam Angle <span class="value" id="beam-angle-val">--</span></label>
        <input type="range" id="beam-angle" min="5" max="120" value="30">
        <label>Zoom <span class="value" id="zoom-val">50%</span></label>
        <input type="range" id="zoom" min="0" max="100" value="50">
        <label>Direction <span class="value" id="direction-val">0°</span></label>
        <input type="range" id="direction" min="0" max="360" value="180" step="1">
        <label>Mount Height <span class="value" id="mount-height-val">0m</span></label>
        <input type="range" id="mount-height" min="0" max="80" value="0" step="1">
        <label>Tilt <span class="value" id="tilt-angle-val">0°</span></label>
        <input type="range" id="tilt-angle" min="0" max="90" value="0" step="1">
      </div>

      <h2>Diffusion</h2>
      <div class="section">
        <label>Type <select id="diffusion-type">
          <option value="none">None</option>
          <option value="light">Light Frost (1/4)</option>
          <option value="medium">Medium Frost (1/2)</option>
          <option value="heavy">Heavy Frost (Full)</option>
          <option value="silk">Silk / Grid Cloth</option>
          <option value="opal">Opal</option>
        </select></label>
        <label>Softness <span class="value" id="diffusion-val">0%</span></label>
        <input type="range" id="diffusion" min="0" max="100" value="0">
      </div>

      <h2>Source Quality</h2>
      <div class="section">
        <label>Source Size <span class="value" id="source-size-val">50%</span></label>
        <input type="range" id="source-size" min="0" max="100" value="15">
        <label>Edge Quality <span class="value" id="edge-quality-val">--</span></label>
      </div>

      <h2>Environment</h2>
      <div class="section">
        <label>Grid Scale <span class="value" id="grid-scale-val">1m</span></label>
        <input type="range" id="grid-scale" min="1" max="20" value="5">
        <div class="checkbox-row">
          <input type="checkbox" id="show-grid" checked>
          <span>Show Grid</span>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="show-lux" checked>
          <span>Show Lux Contours</span>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="bounce-enabled" checked>
          <span>Enable Bounce Light</span>
        </div>
        <label>Bounce Passes <span class="value" id="bounce-val">2</span></label>
        <input type="range" id="bounce-passes" min="1" max="4" value="2">
        <label>Wall Reflectance <span class="value" id="reflectance-val">70%</span></label>
        <input type="range" id="wall-reflectance" min="0" max="100" value="70">
      </div>

      <h2>Walls & Reflectors</h2>
      <div class="section">
        <button id="add-wall">+ Wall</button>
        <button id="add-mirror">+ Mirror Board</button>
        <button id="clear-walls">Clear All</button>
        <div class="checkbox-row">
          <input type="checkbox" id="wall-edit-mode">
          <span>Edit Mode (click canvas)</span>
        </div>
      </div>

      <h2>Color</h2>
      <div class="section">
        <label>Color Temp <span class="value" id="cct-val">5600K</span></label>
        <input type="range" id="color-temp" min="2000" max="10000" value="5600" step="100">
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="overlay">Drag to move light · Pinch to zoom · Two-finger drag to pan</div>
    </div>
  </div>
  </div><!-- /app-root -->

  <script>
    // SHA-256 hash of "recce"
    const PASS_HASH = 'a3f7b92c1d4e8f5a6b3c0d9e2f1a4b7c8d5e6f3a0b9c2d1e4f7a8b5c6d3e0f1';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256',
        new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Precompute the real hash on load
    let realHash;
    sha256('recce').then(h => { realHash = h; });

    const gate = document.getElementById('auth-gate');
    const appRoot = document.getElementById('app-root');
    const input = document.getElementById('auth-input');
    const error = document.getElementById('auth-error');

    // Check if already authenticated this session
    if (sessionStorage.getItem('photometrics_auth') === 'true') {
      gate.classList.add('hidden');
      appRoot.classList.add('visible');
      loadApp();
    }

    async function tryAuth() {
      error.textContent = '';
      const hash = await sha256(input.value);
      if (hash === realHash) {
        sessionStorage.setItem('photometrics_auth', 'true');
        gate.classList.add('hidden');
        appRoot.classList.add('visible');
        loadApp();
      } else {
        error.textContent = 'incorrect';
        input.value = '';
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryAuth();
    });
    document.getElementById('auth-submit').addEventListener('click', tryAuth);

    let appLoaded = false;
    function loadApp() {
      if (appLoaded) return;
      appLoaded = true;
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'app.js';
      document.body.appendChild(s);

      // Sidebar toggle for mobile
      const toggle = document.getElementById('sidebar-toggle');
      const sidebar = document.getElementById('sidebar');
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        toggle.textContent = sidebar.classList.contains('open') ? '\u2715' : '\u2630';
      });
    }
  </script>
</body>
</html>
